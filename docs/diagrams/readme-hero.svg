<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hextech Draft: every click before the loading screen, automated. Auto-Accept, Smart Pick, lane-aware champion pool, auto-runes and spells, item builds, anti-AFK, favorites per lane.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010A13"/>
      <stop offset="100%" stop-color="#091428"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8AA6E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C8AA6E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C8AA6E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titlefade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8AA6E">
        <animate attributeName="offset" values="-0.4;1;-0.4" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F8F1E0">
        <animate attributeName="offset" values="0.1;1.5;0.1" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C8AA6E">
        <animate attributeName="offset" values="0.6;2;0.6" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="scanClip">
      <rect x="260" y="124" width="680" height="10"/>
    </clipPath>

    <!-- Hand-drawn line icons, 24x24 grid — no emoji font, renders identically
         everywhere instead of falling back to a generic glyph on hosts
         without full color-emoji coverage. -->
    <g id="ic-check" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.5"/>
      <path d="M7.5 12.5 L10.5 15.5 L16.5 8.5"/>
    </g>
    <g id="ic-target" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="12" r="5"/>
      <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
      <path d="M12 1 V5 M12 19 V23 M1 12 H5 M19 12 H23"/>
    </g>
    <g id="ic-grid" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7.5" height="7.5" rx="1.2"/>
      <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.2"/>
      <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.2"/>
      <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.2"/>
    </g>
    <g id="ic-book" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6.5 C10 5 6.5 4.3 3.5 4.8 V18.3 C6.5 17.8 10 18.5 12 20 C14 18.5 17.5 17.8 20.5 18.3 V4.8 C17.5 4.3 14 5 12 6.5 Z"/>
      <path d="M12 6.5 V20"/>
    </g>
    <g id="ic-cart" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4 H5.5 L8 15.5 H18 L20 7 H6.3"/>
      <circle cx="9.5" cy="19.5" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="16.5" cy="19.5" r="1.6" fill="currentColor" stroke="none"/>
    </g>
    <g id="ic-shield" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 L20 6.2 V12 C20 17 16.5 20 12 21.5 C7.5 20 4 17 4 12 V6.2 Z"/>
      <path d="M8.5 12 L11 14.5 L15.5 9.5"/>
    </g>
    <g id="ic-star" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 L14.6 9.2 L20.8 9.9 L16.2 14.1 L17.5 20.3 L12 17.1 L6.5 20.3 L7.8 14.1 L3.2 9.9 L9.4 9.2 Z"/>
    </g>
  </defs>

  <style>
    /* Content is always fully visible without animation — motion here is
       ambient polish only, never a gate on whether something renders. */
    @media (prefers-reduced-motion: reduce) {
      .hx-anim, .hx-anim * { animation: none !important; }
    }
    .hx-chip { opacity: 1; animation: hxPulse 4.5s ease-in-out infinite; }
    .hx-chip:nth-child(1) { animation-delay: 0s; }
    .hx-chip:nth-child(2) { animation-delay: .75s; }
    .hx-chip:nth-child(3) { animation-delay: 1.5s; }
    .hx-chip:nth-child(4) { animation-delay: 2.25s; }
    .hx-chip:nth-child(5) { animation-delay: 3s; }
    .hx-chip:nth-child(6) { animation-delay: 3.75s; }
    @keyframes hxPulse { 0%, 100% { filter: none; } 50% { filter: drop-shadow(0 0 4px currentColor); } }
    .hx-corner { opacity: .6; animation: hxCorner 3.2s ease-in-out infinite; }
    @keyframes hxCorner { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
    .hx-beam { animation: hxBeam 3.6s linear infinite; }
    @keyframes hxBeam { 0% { transform: translateX(-420px); } 100% { transform: translateX(420px); } }
  </style>

  <g class="hx-anim">

  <rect x="1" y="1" width="1198" height="258" rx="14" fill="url(#bg)" stroke="#C8AA6E" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="9" y="9" width="1182" height="242" rx="10" fill="none" stroke="#0AC8B9" stroke-opacity="0.18" stroke-width="1"/>

  <!-- corner glyphs, matching the app's own corner-bracket motif -->
  <g stroke="#C8AA6E" stroke-width="1.5" fill="none">
    <path class="hx-corner" d="M22 34 V20 H36" style="animation-delay:0s"/>
    <path class="hx-corner" d="M1178 34 V20 H1164" style="animation-delay:.8s"/>
    <path class="hx-corner" d="M22 226 V240 H36" style="animation-delay:1.6s"/>
    <path class="hx-corner" d="M1178 226 V240 H1164" style="animation-delay:2.4s"/>
  </g>

  <text x="600" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="6" fill="#8A8272">SESSION · RANKED · LCU API</text>

  <text x="600" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="42" letter-spacing="3" fill="url(#titlefade)">HEXTECH DRAFT</text>

  <rect x="260" y="128" width="680" height="1.5" fill="url(#goldline)"/>
  <g clip-path="url(#scanClip)">
    <rect class="hx-beam" x="0" y="124" width="60" height="10" fill="#0AC8B9" fill-opacity="0.45"/>
  </g>

  <text x="600" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F0E6D2">Every click before the loading screen — automated.</text>

  <!-- feature chip row -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">
    <g class="hx-chip" transform="translate(40,196)" style="color:#00FF9C">
      <rect width="168" height="34" rx="7" fill="#00FF9C" fill-opacity="0.07" stroke="#00FF9C" stroke-opacity="0.35"/>
      <use href="#ic-check" x="14" y="5" width="22" height="22" stroke="#00FF9C" color="#00FF9C"/>
      <text x="92" y="22" text-anchor="middle" fill="#00FF9C">Auto-Accept</text>
    </g>
    <g class="hx-chip" transform="translate(222,196)" style="color:#0AC8B9">
      <rect width="168" height="34" rx="7" fill="#0AC8B9" fill-opacity="0.08" stroke="#0AC8B9" stroke-opacity="0.4"/>
      <use href="#ic-target" x="14" y="5" width="22" height="22" stroke="#0AC8B9" color="#0AC8B9"/>
      <text x="92" y="22" text-anchor="middle" fill="#0AC8B9">Smart Pick</text>
    </g>
    <g class="hx-chip" transform="translate(404,196)" style="color:#C8AA6E">
      <rect width="180" height="34" rx="7" fill="#C8AA6E" fill-opacity="0.08" stroke="#C8AA6E" stroke-opacity="0.45"/>
      <use href="#ic-grid" x="14" y="5" width="22" height="22" stroke="#C8AA6E" color="#C8AA6E"/>
      <text x="98" y="22" text-anchor="middle" fill="#C8AA6E">Lane-Aware Pool</text>
    </g>
    <g class="hx-chip" transform="translate(598,196)" style="color:#0AC8B9">
      <rect width="156" height="34" rx="7" fill="#0AC8B9" fill-opacity="0.08" stroke="#0AC8B9" stroke-opacity="0.4"/>
      <use href="#ic-book" x="14" y="5" width="22" height="22" stroke="#0AC8B9" color="#0AC8B9"/>
      <text x="86" y="22" text-anchor="middle" fill="#0AC8B9">Runes &amp; Spells</text>
    </g>
    <g class="hx-chip" transform="translate(768,196)" style="color:#C8AA6E">
      <rect width="140" height="34" rx="7" fill="#C8AA6E" fill-opacity="0.08" stroke="#C8AA6E" stroke-opacity="0.45"/>
      <use href="#ic-cart" x="14" y="5" width="22" height="22" stroke="#C8AA6E" color="#C8AA6E"/>
      <text x="80" y="22" text-anchor="middle" fill="#C8AA6E">Item Builds</text>
    </g>
    <g class="hx-chip" transform="translate(922,196)" style="color:#FF4E50">
      <rect width="126" height="34" rx="7" fill="#FF4E50" fill-opacity="0.07" stroke="#FF4E50" stroke-opacity="0.35"/>
      <use href="#ic-shield" x="14" y="5" width="22" height="22" stroke="#FF4E50" color="#FF4E50"/>
      <text x="76" y="22" text-anchor="middle" fill="#FF4E50">Anti-AFK</text>
    </g>
    <g class="hx-chip" transform="translate(1062,196)" style="color:#C8AA6E">
      <rect width="118" height="34" rx="7" fill="#C8AA6E" fill-opacity="0.08" stroke="#C8AA6E" stroke-opacity="0.45"/>
      <use href="#ic-star" x="14" y="5" width="22" height="22" stroke="#C8AA6E" color="#C8AA6E"/>
      <text x="72" y="22" text-anchor="middle" fill="#C8AA6E">Favorites</text>
    </g>
  </g>

  </g>
</svg>
