<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hextech Draft: every click before the loading screen, automated. Auto-Accept, Smart Pick, lane-aware champion pool, auto-runes and spells, item builds, anti-AFK, favorites per lane.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#010A13"/>
      <stop offset="100%" stop-color="#091428"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8AA6E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C8AA6E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C8AA6E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titlefade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8AA6E"/>
      <stop offset="55%" stop-color="#F0E6D2"/>
      <stop offset="100%" stop-color="#C8AA6E"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="14" fill="url(#bg)" stroke="#C8AA6E" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="9" y="9" width="1182" height="242" rx="10" fill="none" stroke="#0AC8B9" stroke-opacity="0.18" stroke-width="1"/>

  <!-- corner glyphs, matching the app's own corner-bracket motif -->
  <g stroke="#C8AA6E" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M22 34 V20 H36"/>
    <path d="M1178 34 V20 H1164"/>
    <path d="M22 226 V240 H36"/>
    <path d="M1178 226 V240 H1164"/>
  </g>

  <text x="600" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="6" fill="#8A8272">SESSION · RANKED · LCU API</text>

  <text x="600" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="42" letter-spacing="3" fill="url(#titlefade)">HEXTECH DRAFT</text>

  <rect x="260" y="128" width="680" height="1.5" fill="url(#goldline)"/>

  <text x="600" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#F0E6D2">Every click before the loading screen — automated.</text>

  <!-- feature chip row -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(40,196)">
      <rect width="168" height="34" rx="7" fill="#00FF9C" fill-opacity="0.07" stroke="#00FF9C" stroke-opacity="0.35"/>
      <text x="84" y="22" text-anchor="middle" fill="#00FF9C">🟢 Auto-Accept</text>
    </g>
    <g transform="translate(222,196)">
      <rect width="168" height="34" rx="7" fill="#0AC8B9" fill-opacity="0.08" stroke="#0AC8B9" stroke-opacity="0.4"/>
      <text x="84" y="22" text-anchor="middle" fill="#0AC8B9">🧠 Smart Pick</text>
    </g>
    <g transform="translate(404,196)">
      <rect width="168" height="34" rx="7" fill="#C8AA6E" fill-opacity="0.08" stroke="#C8AA6E" stroke-opacity="0.45"/>
      <text x="84" y="22" text-anchor="middle" fill="#C8AA6E">🗺️ Lane-Aware Pool</text>
    </g>
    <g transform="translate(586,196)">
      <rect width="148" height="34" rx="7" fill="#0AC8B9" fill-opacity="0.08" stroke="#0AC8B9" stroke-opacity="0.4"/>
      <text x="74" y="22" text-anchor="middle" fill="#0AC8B9">📖 Runes &amp; Spells</text>
    </g>
    <g transform="translate(748,196)">
      <rect width="148" height="34" rx="7" fill="#C8AA6E" fill-opacity="0.08" stroke="#C8AA6E" stroke-opacity="0.45"/>
      <text x="74" y="22" text-anchor="middle" fill="#C8AA6E">🛒 Item Builds</text>
    </g>
    <g transform="translate(910,196)">
      <rect width="130" height="34" rx="7" fill="#FF4E50" fill-opacity="0.07" stroke="#FF4E50" stroke-opacity="0.35"/>
      <text x="65" y="22" text-anchor="middle" fill="#FF4E50">🛡️ Anti-AFK</text>
    </g>
    <g transform="translate(1052,196)">
      <rect width="108" height="34" rx="7" fill="#C8AA6E" fill-opacity="0.08" stroke="#C8AA6E" stroke-opacity="0.45"/>
      <text x="54" y="22" text-anchor="middle" fill="#C8AA6E">★ Favorites</text>
    </g>
  </g>
</svg>
